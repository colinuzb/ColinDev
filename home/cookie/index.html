<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>𝐂𝐨𝐥𝐢𝐧𝐔𝐳𝐛 𝐂𝐨𝐨𝐤𝐢𝐞</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="../../img/logo.png">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="page">
      <h1>𝐂𝐨𝐥𝐢𝐧𝐔𝐳𝐛 𝐖𝐞𝐛 𝐃𝐚𝐬𝐭𝐮𝐫𝐢𝐠𝐚 𝐇𝐮𝐬𝐡 𝐊𝐞𝐥𝐢𝐛𝐬𝐢𝐳❗</h1>
      <p>𝐔𝐬𝐡𝐛𝐮 𝐃𝐚𝐬𝐭𝐮𝐫 𝐂𝐨𝐨𝐤𝐢𝐞 𝐃𝐞𝐦𝐨 𝐕𝐚𝐫𝐢𝐚𝐧𝐭 𝐐𝐢𝐬𝐦𝐢 𝐇𝐢𝐬𝐨𝐛𝐥𝐚𝐧𝐚𝐝𝐢.</p>
      <button class="reset-btn" id="resetBtn">𝐂𝐨𝐨𝐤𝐢𝐞 𝐃𝐚𝐬𝐭𝐮𝐫𝐧𝐢 𝐘𝐚𝐧𝐠𝐢𝐥𝐚𝐬𝐡.</button>
    </div>

    <div class="cookie-banner" id="cookieBanner">
      <div class="cookie-content">
        <div class="cookie-icon">🍪</div>
        <div class="cookie-text">
          <h3>𝐂𝐨𝐨𝐤𝐢𝐞 𝐅𝐨𝐲𝐝𝐚𝐥𝐚𝐧𝐢𝐬𝐡</h3>
          <p>
            𝐃𝐚𝐬𝐭𝐮𝐫 𝐔𝐜𝐡𝐮𝐧 𝐇𝐢𝐬𝐬𝐚 𝐐𝐨❜𝐬𝐡𝐢𝐬𝐡
          </p>
        </div>
      </div>

      <div class="cookie-actions">
        <button class="btn btn-secondary" id="declineBtn">𝐎❜𝐜𝐡𝐢𝐫𝐢𝐬𝐡</button>
        <button class="btn btn-primary" id="acceptBtn">𝐐𝐚𝐛𝐮𝐥 𝐐𝐢𝐥𝐢𝐬𝐡</button>
      </div>
    </div>
  </body>
</html>
