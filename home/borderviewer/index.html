<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>𝐁𝐨𝐫𝐝𝐞𝐫 𝐑𝐚𝐝𝐢𝐮𝐬 𝐀𝐧𝐢𝐪𝐥𝐚𝐬𝐡</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <link rel="icon" href="../../img/logo.png">
  </head>
  <body>
    <header class="header">
      <a href="../../index.html">𝐐𝐚𝐲𝐭𝐢𝐬𝐡</a>

    </header>
    <div class="container">
      <div class="card">
        <h1>𝐁𝐨𝐫𝐝𝐞𝐫 𝐑𝐚𝐝𝐢𝐮𝐬 𝐀𝐧𝐢𝐪𝐥𝐚𝐬𝐡</h1>
        <p class="subtitle">𝐃𝐚𝐬𝐭𝐮𝐫 𝐂𝐒𝐒 𝐝𝐚 𝐂𝐚𝐫𝐝 𝐘𝐨𝐤𝐢 𝐂𝐨𝐧𝐭𝐚𝐢𝐧𝐞𝐫𝐥𝐚𝐫𝐧𝐢 𝐑𝐚𝐝𝐢𝐮𝐬𝐢𝐧𝐢 𝐀𝐧𝐢𝐪𝐥𝐚𝐛 𝐁𝐞𝐫𝐚𝐝𝐢.</p>

        <div class="preview-section">
          <div class="preview-box" id="previewBox"></div>
        </div>

        <div class="controls">
          <div class="control-group">
            <label for="radiusSlider">
              <span>𝐁𝐨𝐫𝐝𝐞𝐫 𝐑𝐚𝐝𝐢𝐮𝐬</span>
              <span class="value" id="radiusValue">0px</span>
            </label>

            <input type="range" id="radiusSlider" min="0" max="100" value="0" />
          </div>
        </div>

        <div class="code-output">
          <label>𝐂𝐒𝐒 𝐂𝐨𝐝𝐞</label>
          <div class="code-box">
            <code id="cssCode">border-radius: 0px;</code>
            <button class="copy-btn" id="copyBtn">𝐊𝐨❜𝐜𝐡𝐢𝐫𝐢𝐬𝐡</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
