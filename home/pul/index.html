<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>𝐓𝐫𝐚𝐝𝐢𝐧𝐠 | 𝐂𝐨𝐥𝐢𝐧𝐔𝐳𝐛</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="../../img/logo.png">
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>𝐓𝐫𝐚𝐝𝐢𝐧𝐠 | 𝐂𝐨𝐥𝐢𝐧𝐔𝐳𝐛</h1>

      <form id="converter-form">
        <div class="form-group">
          <label for="amount">𝐍𝐚𝐫𝐱</label>
          <input type="number" id="amount" placeholder="𝐇𝐢𝐬𝐨𝐛𝐧𝐢 𝐊𝐢𝐫𝐢𝐭𝐢𝐧𝐠" required />
        </div>

        <div class="form-group">
          <label for="from-currency">𝐃𝐚𝐧</label>
          <select id="from-currency">

          </select>
        </div>

        <div class="form-group">
          <label for="to-currency">𝐆𝐚</label>
          <select id="to-currency">

          </select>
        </div>

        <button type="submit">𝐇𝐢𝐬𝐨𝐛𝐥𝐚𝐬𝐡</button>
      </form>

      <div id="result"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
