<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>𝐁𝐨𝐱 𝐒𝐡𝐚𝐝𝐨𝐰 𝐘𝐚𝐫𝐚𝐭𝐮𝐯𝐜𝐡𝐢</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="../../img/logo.png">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <a href="../../index.html">𝐐𝐚𝐲𝐭𝐢𝐬𝐡</a>

    </header>
    <div class="container">
      <div class="card">
        <h1>𝐁𝐨𝐱 𝐒𝐡𝐚𝐝𝐨𝐰 𝐘𝐚𝐫𝐚𝐭𝐮𝐯𝐜𝐡𝐢</h1>
        <p class="subtitle">𝐂𝐚𝐫𝐝 𝐘𝐨𝐤𝐢 𝐁𝐨𝐱𝐥𝐚𝐫 𝐔𝐜𝐡𝐮𝐧 𝐒𝐡𝐚𝐝𝐨𝐰 𝐘𝐚𝐭𝐚𝐫𝐢𝐬𝐡 𝐄𝐧𝐝𝐢 𝐎𝐬𝐨𝐧.</p>

        <div class="preview-section">
          <div class="preview-box" id="previewBox"></div>
        </div>

        <div class="controls">
          <div class="control-group">
            <label for="offsetX">
              <span>𝐄𝐧𝐢𝐠𝐚 𝐗</span>
              <span class="value" id="offsetXValue">0px</span>
            </label>

            <input type="range" id="offsetX" min="-50" max="50" value="0" />
          </div>

          <div class="control-group">
            <label for="offsetY">
              <span>𝐁𝐨❜𝐲𝐢𝐠𝐚 𝐘</span>
              <span class="value" id="offsetYValue">0px</span>
            </label>

            <input type="range" id="offsetY" min="-50" max="50" value="0" />
          </div>

          <div class="control-group">
            <label for="blur">
              <span>𝐁𝐥𝐮𝐫</span>
              <span class="value" id="blurValue">0px</span>
            </label>

            <input type="range" id="blur" min="0" max="50" value="0" />
          </div>

          <div class="control-group">
            <label for="spread">
              <span>𝐎❜𝐥𝐜𝐡𝐚𝐦𝐢</span>
              <span class="value" id="spreadValue">0px</span>
            </label>
            <input type="range" id="spread" min="-20" max="20" value="0" />
          </div>

          <div class="control-group">
            <label for="opacity">
              <span>𝐒𝐡𝐚𝐫𝐩𝐚</span>
              <span class="value" id="opacityValue">0.5</span>
            </label>
            <input type="range" id="opacity" min="0" max="100" value="50" />
          </div>
        </div>

        <div class="code-output">
          <label>𝐂𝐒𝐒 𝐂𝐨𝐝𝐞</label>
          <div class="code-box">
            <code id="cssCode">box-shadow: 0px 0px 0px 0px rgba(0, 0, 0, 0.5);</code>
            <button class="copy-btn" id="copyBtn">𝐊𝐨❜𝐜𝐡𝐢𝐫𝐢𝐬𝐡</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
